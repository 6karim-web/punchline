name: punchline
description: A daily brief that ends with a punchline.
publish_to: 'none'
version: 0.6.0+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.2
  xml: ^6.5.0
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  intl: any

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/jokes.json
