name: punchline
description: One punchline a day, and games to go with it.
publish_to: 'none'
version: 0.7.0+7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/jokes.json
    - assets/jokes_fr.json
